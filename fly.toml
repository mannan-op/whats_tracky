app = "whats-tracky"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DATABASE_PATH = "/data/budget.db"
  CURRENCY = "PKR"
  TZ = "Asia/Karachi"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[mounts]]
  source = "budget_data"
  destination = "/data"
