services:
  - type: web
    name: whats-tracky
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: budget-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /data/budget.db
      - key: CURRENCY
        value: PKR
      - key: TZ
        value: Asia/Karachi
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
